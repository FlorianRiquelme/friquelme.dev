name: Agent task
description: A task an agent can work to completion, with checkable acceptance examples.
title: ""
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What to change and why.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Concrete, checkable acceptance examples. The worker turns each one into a test or an observable check.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links, constraints, files.
    validations:
      required: false
