name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: website-verification
          path: reports/
          retention-days: 7
          if-no-files-found: error

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            infra/pnpm-lock.yaml
      # The CDK stack imports the site's CSP builder, whose tsconfig extends
      # astro's, so the root workspace has to be installed as well.
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C infra install --frozen-lockfile
      - run: pnpm verify:infra
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: infrastructure-verification
          path: reports/verification-infra/
          retention-days: 7
          if-no-files-found: error
